# place's intents (alf-hierarchy step 2, opus): what the person says to have the held object put
# somewhere — one verb, PUT(object, receptacle), whose atom is the specialist's goal put(O, R);
# the domain answers placed(O, R) or refused(R) (elsewhere, shut, empty-handed). A TEMPLATE:
# world/gen_hier.py fills the `object` and `receptacle` enums and values with the activation's
# things (objects that can be picked up, every receptacle) and keeps the examples whose values
# the game has. The program: ../place_domain.llp.
persona: |
  You are the hands of a household robot that put things down: the tomato in the fridge, the
  mug on the counter, the book on the desk. The person tells you what to put where. Map what
  they say to exactly one intent JSON per utterance. Respond with only the JSON.

verbs:
  - {verb: PUT, meaning: "put an object (the one held) in or on a receptacle"}
  - {verb: UNKNOWN, meaning: "anything else: going somewhere, opening, picking up, a question, small talk"}

slots:
  object: {enum: []}
  receptacle: {enum: []}

guidance: |
  Things are their kind and their number written together, lower case, no space: "mug 2" is
  mug2, "drawer 3" is drawer3, "counter 2" is countertop2. A kind named without a number, or
  one the room has only one of, is number 1: "the tomato" is tomato1, "the fridge" is fridge1,
  "the counter" is countertop1, "the table" is diningtable1. Use only the things listed in
  the schema. Putting, placing, dropping,
  setting something in or on a receptacle is PUT; picking up or going is UNKNOWN here.

examples:
  - ["put the tomato in the fridge", {"intent":"PUT","object":"tomato1","receptacle":"fridge1"}]
  - ["place mug 2 on the counter", {"intent":"PUT","object":"mug2","receptacle":"countertop1"}]
  - ["drop the apple in drawer 3", {"intent":"PUT","object":"apple1","receptacle":"drawer3"}]
  - ["set the knife on the table", {"intent":"PUT","object":"knife1","receptacle":"diningtable1"}]
  - ["put the egg in the microwave", {"intent":"PUT","object":"egg1","receptacle":"microwave1"}]
  - ["put the soap on the toilet", {"intent":"PUT","object":"soapbottle1","receptacle":"toilet1"}]
  - ["put the book on the desk", {"intent":"PUT","object":"book1","receptacle":"desk1"}]
  - ["pick up the tomato", {"intent":"UNKNOWN"}]
  - ["go to the fridge", {"intent":"UNKNOWN"}]
  - ["tell me a joke", {"intent":"UNKNOWN"}]

spoken:
  heading: Spoken response (after the JSON)
  text: |
    After the JSON comes "Spoken response:" and one short sentence the robot says, in the first
    person. Never JSON, never an intent name.
  examples:
    - ["put the tomato in the fridge", {"intent":"PUT","object":"tomato1","receptacle":"fridge1"}, "Putting the tomato in the fridge."]
    - ["place mug 2 on the counter", {"intent":"PUT","object":"mug2","receptacle":"countertop1"}, "Placing mug 2 on the counter."]
    - ["put the book on the desk", {"intent":"PUT","object":"book1","receptacle":"desk1"}, "Putting the book on the desk."]

map:
  - {verb: PUT, atom: "put({object:object}, {receptacle:receptacle})", act: put}
values:
  object: {}
  receptacle: {}

asks: []
outcomes: {placed: done, refused: refused}
alternatives:
  max: 0
  rules: {}
